
    <!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essensplan</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; max-width: 900px; }
h1 { margin-bottom: 10px; }
section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; border-radius: 12px; }
h2 { margin-top: 0; }
button { padding: 6px 10px; margin: 4px 0; }
input, select { padding: 6px; margin: 4px 0; }
ul { list-style: none; padding: 0; }
li { margin: 4px 0; }
.recipe-card { border: 1px solid #ccc; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
.recipe-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.recipe-header h3 { margin: 0; }
.delete-btn { margin-left: 10px; color: red; }
.collapsed { display: none; }
</style>
</head>
<body>

<h1>Essensplan</h1>

<section>
<h2>Wochenplan</h2>
<div id="weekPlan"></div>
</section>

<!-- Einkaufsliste jetzt ÜBER den Rezepten -->
<section>
<h2>Einkaufsliste</h2>
<ul id="shoppingList"></ul>
</section>

<section>
<h2>Rezepte importieren (Excel / CSV)</h2>
<input type="file" id="csvFile" accept=".csv">
<button id="importCsvBtn">Import starten</button>
<p>Format: Gericht, Zutat, Menge, Einheit (Komma ODER Semikolon)</p>
</section>

<section>
<h2>Rezepte</h2>
<input id="newRecipeName" placeholder="Neues Rezept">
<button id="addRecipeBtn">Rezept hinzufügen</button>
<div id="recipes"></div>
</section>

<section>
<h2>Zusätzliche Einkäufe (z.B. Frühstück)</h2>
<input id="extraName" placeholder="Zutat">
<input id="extraAmount" type="number" placeholder="Menge" style="width:80px;">
<input id="extraUnit" placeholder="Einheit" style="width:80px;">
<button id="addExtraBtn">Hinzufügen</button>
<ul id="extraList"></ul>
</section>

<script>
const days = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];

let data = JSON.parse(localStorage.getItem("mealData")) || {
  recipes: [],
  plan: {},
  extras: [],
  shoppingState: {}
};

function save() {
  localStorage.setItem("mealData", JSON.stringify(data));
}

function renderWeek() {
  const container = document.getElementById("weekPlan");
  container.innerHTML = "";

  days.forEach(day => {
    const div = document.createElement("div");
    const select = document.createElement("select");

    const empty = document.createElement("option");
    empty.value = "";
    empty.textContent = "-- auswählen --";
    select.appendChild(empty);

    data.recipes.forEach(r => {
      const opt = document.createElement("option");
      opt.value = r.name;
      opt.textContent = r.name;
      if (data.plan[day] === r.name) opt.selected = true;
      select.appendChild(opt);
    });

    select.onchange = () => {
      data.plan[day] = select.value;
      save();
      renderShopping();
    };

    div.innerHTML = `<strong>${day}:</strong> `;
    div.appendChild(select);
    container.appendChild(div);
  });
}

function renderRecipes() {
  const container = document.getElementById("recipes");
  container.innerHTML = "";

  data.recipes.forEach((recipe, recipeIndex) => {
    const card = document.createElement("div");
    card.className = "recipe-card";

    const header = document.createElement("div");
    header.className = "recipe-header";

    const title = document.createElement("h3");
    title.textContent = recipe.name;

    const deleteRecipeBtn = document.createElement("button");
    deleteRecipeBtn.textContent = "Löschen";
    deleteRecipeBtn.className = "delete-btn";
    deleteRecipeBtn.onclick = (e) => {
      e.stopPropagation();
      data.recipes.splice(recipeIndex, 1);
      Object.keys(data.plan).forEach(day => {
        if (data.plan[day] === recipe.name) data.plan[day] = "";
      });
      save();
      renderRecipes();
      renderWeek();
      renderShopping();
    };

    header.appendChild(title);
    header.appendChild(deleteRecipeBtn);

    const content = document.createElement("div");
    content.className = "collapsed"; // Standard: zugeklappt

    const ul = document.createElement("ul");
    recipe.ingredients.forEach((ing, ingIndex) => {
      const li = document.createElement("li");
      li.textContent = `${ing.name} – ${ing.amount} ${ing.unit}`;

      const delBtn = document.createElement("button");
      delBtn.textContent = "x";
      delBtn.className = "delete-btn";
      delBtn.onclick = () => {
        recipe.ingredients.splice(ingIndex, 1);
        save();
        renderRecipes();
        renderShopping();
      };

      li.appendChild(delBtn);
      ul.appendChild(li);
    });

    content.appendChild(ul);

    header.onclick = () => {
      content.classList.toggle("collapsed");
    };

    card.appendChild(header);
    card.appendChild(content);
    container.appendChild(card);
  });
}

function renderExtras() {
  const ul = document.getElementById("extraList");
  ul.innerHTML = "";

  data.extras.forEach((e, index) => {
    const li = document.createElement("li");
    li.textContent = `${e.name} – ${e.amount} ${e.unit}`;

    const delBtn = document.createElement("button");
    delBtn.textContent = "x";
    delBtn.className = "delete-btn";
    delBtn.onclick = () => {
      data.extras.splice(index, 1);
      save();
      renderExtras();
      renderShopping();
    };

    li.appendChild(delBtn);
    ul.appendChild(li);
  });
}

function renderShopping() {
  const ul = document.getElementById("shoppingList");
  ul.innerHTML = "";

  const totals = {};

  Object.values(data.plan).forEach(recipeName => {
    if (!recipeName) return;
    const recipe = data.recipes.find(r => r.name === recipeName);
    if (!recipe) return;

    recipe.ingredients.forEach(ing => {
      const key = ing.name + "|" + ing.unit;
      if (!totals[key]) totals[key] = { ...ing };
      else totals[key].amount += ing.amount;
    });
  });

  data.extras.forEach(e => {
    const key = e.name + "|" + e.unit;
    if (!totals[key]) totals[key] = { ...e };
    else totals[key].amount += e.amount;
  });

  Object.values(totals).forEach(item => {
    const key = item.name + "|" + item.unit;
    const li = document.createElement("li");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = !!data.shoppingState[key];

    const span = document.createElement("span");
    span.textContent = ` ${item.name} – ${item.amount} ${item.unit}`;

    if (checkbox.checked) {
      span.style.textDecoration = "line-through";
      span.style.color = "#888";
    }

    checkbox.onchange = () => {
      data.shoppingState[key] = checkbox.checked;
      save();
      renderShopping();
    };

    li.appendChild(checkbox);
    li.appendChild(span);
    ul.appendChild(li);
  });
}

renderWeek();
renderRecipes();
renderExtras();
renderShopping();
</script>

</body>
</html>
