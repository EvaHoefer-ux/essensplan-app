
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essensplan</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; max-width: 900px; }
h1 { margin-bottom: 10px; }
section { margin-bottom: 30px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
button { padding: 6px 10px; margin: 4px 0; }
input, select { padding: 5px; margin: 4px 0; }
ul { list-style: none; padding: 0; }
li { margin: 4px 0; }
.recipe-card { border: 1px solid #ccc; padding: 8px; border-radius: 6px; margin-bottom: 8px; }
.small { font-size: 0.9em; color: #555; }
</style>
</head>
<body>

<h1>Essensplan</h1>

<section>
<h2>Wochenplan</h2>
<div id="weekPlan"></div>
</section>

<section>
<h2>Rezepte</h2>
<input id="newRecipeName" placeholder="Neues Rezept">
<button id="addRecipeBtn">Rezept hinzufügen</button>
<div id="recipes"></div>
</section>

<section>
<h2>Zusätzliche Einkäufe (z.B. Frühstück)</h2>
<input id="extraName" placeholder="Zutat">
<input id="extraAmount" type="number" placeholder="Menge" style="width:80px;">
<input id="extraUnit" placeholder="Einheit" style="width:80px;">
<button id="addExtraBtn">Hinzufügen</button>
<ul id="extraList"></ul>
</section>

<section>
<h2>Einkaufsliste</h2>
<ul id="shoppingList"></ul>
</section>

<script>
const days = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];

let data = JSON.parse(localStorage.getItem("mealData")) || {
  recipes: [],
  plan: {},
  extras: [],
  shoppingState: {}
};

function save() {
  localStorage.setItem("mealData", JSON.stringify(data));
}

function renderWeek() {
  const container = document.getElementById("weekPlan");
  container.innerHTML = "";

  days.forEach(day => {
    const div = document.createElement("div");
    const select = document.createElement("select");

    const empty = document.createElement("option");
    empty.value = "";
    empty.textContent = "-- auswählen --";
    select.appendChild(empty);

    data.recipes.forEach(r => {
      const opt = document.createElement("option");
      opt.value = r.name;
      opt.textContent = r.name;
      if (data.plan[day] === r.name) opt.selected = true;
      select.appendChild(opt);
    });

    select.onchange = () => {
      data.plan[day] = select.value;
      save();
      renderShopping();
    };

    div.innerHTML = `<strong>${day}:</strong> `;
    div.appendChild(select);
    container.appendChild(div);
  });
}

function renderRecipes() {
  const container = document.getElementById("recipes");
  container.innerHTML = "";

  data.recipes.forEach(recipe => {
    const card = document.createElement("div");
    card.className = "recipe-card";

    const title = document.createElement("h3");
    title.textContent = recipe.name;

    const ul = document.createElement("ul");
    recipe.ingredients.forEach(ing => {
      const li = document.createElement("li");
      li.textContent = `${ing.name} – ${ing.amount} ${ing.unit}`;
      ul.appendChild(li);
    });

    const nameInput = document.createElement("input");
    nameInput.placeholder = "Zutat";

    const amountInput = document.createElement("input");
    amountInput.type = "number";
    amountInput.placeholder = "Menge";
    amountInput.style.width = "70px";

    const unitInput = document.createElement("input");
    unitInput.placeholder = "Einheit";
    unitInput.style.width = "70px";

    const btn = document.createElement("button");
    btn.textContent = "Zutat hinzufügen";

    btn.onclick = () => {
      if (!nameInput.value || !amountInput.value || !unitInput.value) return;
      recipe.ingredients.push({
        name: nameInput.value,
        amount: Number(amountInput.value),
        unit: unitInput.value
      });
      save();
      renderRecipes();
      renderShopping();
    };

    card.appendChild(title);
    card.appendChild(ul);
    card.appendChild(nameInput);
    card.appendChild(amountInput);
    card.appendChild(unitInput);
    card.appendChild(btn);

    container.appendChild(card);
  });
}

function renderExtras() {
  const ul = document.getElementById("extraList");
  ul.innerHTML = "";
  data.extras.forEach((e, index) => {
    const li = document.createElement("li");
    li.textContent = `${e.name} – ${e.amount} ${e.unit}`;
    ul.appendChild(li);
  });
}

function renderShopping() {
  const ul = document.getElementById("shoppingList");
  ul.innerHTML = "";

  const totals = {};

  Object.values(data.plan).forEach(recipeName => {
    if (!recipeName) return;
    const recipe = data.recipes.find(r => r.name === recipeName);
    if (!recipe) return;

    recipe.ingredients.forEach(ing => {
      const key = ing.name + "|" + ing.unit;
      if (!totals[key]) totals[key] = { ...ing };
      else totals[key].amount += ing.amount;
    });
  });

  data.extras.forEach(e => {
    const key = e.name + "|" + e.unit;
    if (!totals[key]) totals[key] = { ...e };
    else totals[key].amount += e.amount;
  });

  Object.values(totals).forEach(item => {
    const key = item.name + "|" + item.unit;
    const li = document.createElement("li");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = !!data.shoppingState[key];

    const span = document.createElement("span");
    span.textContent = ` ${item.name} – ${item.amount} ${item.unit}`;

    if (checkbox.checked) {
      span.style.textDecoration = "line-through";
      span.style.color = "#888";
    }

    checkbox.onchange = () => {
      data.shoppingState[key] = checkbox.checked;
      save();
      renderShopping();
    };

    li.appendChild(checkbox);
    li.appendChild(span);
    ul.appendChild(li);
  });
}

// Events

document.getElementById("addRecipeBtn").onclick = () => {
  const name = document.getElementById("newRecipeName").value.trim();
  if (!name) return;
  data.recipes.push({ name, ingredients: [] });
  document.getElementById("newRecipeName").value = "";
  save();
  renderRecipes();
  renderWeek();
};

document.getElementById("addExtraBtn").onclick = () => {
  const name = document.getElementById("extraName").value.trim();
  const amount = Number(document.getElementById("extraAmount").value);
  const unit = document.getElementById("extraUnit").value.trim();
  if (!name || !amount || !unit) return;

  data.extras.push({ name, amount, unit });
  document.getElementById("extraName").value = "";
  document.getElementById("extraAmount").value = "";
  document.getElementById("extraUnit").value = "";
  save();
  renderExtras();
  renderShopping();
};

renderWeek();
renderRecipes();
renderExtras();
renderShopping();
</script>

</body>
</html>
