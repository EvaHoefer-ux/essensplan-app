<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essensplan</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; max-width: 900px; background:#f4f8ff; }
h1 { margin-bottom: 10px; color:#1e3a8a; }
section { margin-bottom: 25px; padding: 15px; border-radius: 14px; background:white; box-shadow:0 4px 10px rgba(0,0,0,0.05); }
h2 { margin-top: 0; color:#1d4ed8; }
button { padding: 7px 12px; margin: 4px 0; border-radius:8px; border:none; background:#2563eb; color:white; cursor:pointer; }
button:hover { background:#1d4ed8; }
input, select { padding: 6px; margin: 4px 0; border-radius:6px; border:1px solid #cbd5e1; }
ul { list-style: none; padding: 0; }
li { margin: 6px 0; }
.recipe-card { border: 1px solid #dbeafe; padding: 10px; border-radius: 12px; margin-bottom: 10px; }
.recipe-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.recipe-header h3 { margin: 0; }
.delete-btn { background:#ef4444; }
.collapsed { display: none; }
</style>
</head>
<body>

<h1>Essensplan</h1>

<section>
<h2>Wochenplan</h2>
<div id="weekPlan"></div>
</section>

<section>
<h2>Zusätzliche Einkäufe</h2>
<input id="extraName" placeholder="Zutat">
<input id="extraAmount" type="number" placeholder="Menge" style="width:80px;">
<input id="extraUnit" placeholder="Einheit" style="width:80px;">
<button id="addExtraBtn">Hinzufügen</button>
<ul id="extraList"></ul>
</section>

<section>
<h2>Einkaufsliste</h2>
<ul id="shoppingList"></ul>
</section>

<section>
<h2>Rezepte</h2>
<input id="newRecipeName" placeholder="Neues Rezept">
<button id="addRecipeBtn">Rezept hinzufügen</button>
<div id="recipes"></div>
</section>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDpjH6LT6hG2Md_B3NWZiNhLarPXGxsrfM",
  authDomain: "einkaufsplan-22030.firebaseapp.com",
  projectId: "einkaufsplan-22030",
  storageBucket: "einkaufsplan-22030.firebasestorage.app",
  messagingSenderId: "80931074953",
  appId: "1:80931074953:web:d9137d523329ee6c6d2758",
  measurementId: "G-828SQ93WP9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const dataRef = doc(db, "shared", "mealData");

const days = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];

let data = { recipes: [], plan: {}, extras: [], shoppingState: {} };

// 🔄 LIVE SYNC
onSnapshot(dataRef, (snap) => {
  if (snap.exists()) {
    data = snap.data();
    renderAll();
  } else {
    save();
  }
});

async function save() {
  await setDoc(dataRef, data);
}

function renderAll(){
  renderWeek();
  renderRecipes();
  renderExtras();
  renderShopping();
}

function renderWeek() {
  const container = document.getElementById("weekPlan");
  container.innerHTML = "";

  days.forEach(day => {
    const div = document.createElement("div");
    const select = document.createElement("select");

    const empty = document.createElement("option");
    empty.value = "";
    empty.textContent = "-- auswählen --";
    select.appendChild(empty);

    data.recipes.forEach(r => {
      const opt = document.createElement("option");
      opt.value = r.name;
      opt.textContent = r.name;
      if (data.plan?.[day] === r.name) opt.selected = true;
      select.appendChild(opt);
    });

    select.onchange = async () => {
      data.plan[day] = select.value;
      await save();
    };

    div.innerHTML = `<strong>${day}:</strong> `;
    div.appendChild(select);
    container.appendChild(div);
  });
}

function renderRecipes() {
  const container = document.getElementById("recipes");
  container.innerHTML = "";

  data.recipes.forEach((recipe, recipeIndex) => {
    const card = document.createElement("div");
    card.className = "recipe-card";

    const header = document.createElement("div");
    header.className = "recipe-header";

    const title = document.createElement("h3");
    title.textContent = recipe.name;

    const deleteRecipeBtn = document.createElement("button");
    deleteRecipeBtn.textContent = "Löschen";
    deleteRecipeBtn.className = "delete-btn";
    deleteRecipeBtn.onclick = async (e) => {
      e.stopPropagation();
      data.recipes.splice(recipeIndex, 1);
      await save();
    };

    header.appendChild(title);
    header.appendChild(deleteRecipeBtn);

    const content = document.createElement("div");
    content.className = "collapsed";

    const ul = document.createElement("ul");
    recipe.ingredients?.forEach((ing, ingIndex) => {
      const li = document.createElement("li");
      li.textContent = `${ing.name} – ${ing.amount} ${ing.unit}`;

      const delBtn = document.createElement("button");
      delBtn.textContent = "x";
      delBtn.className = "delete-btn";
      delBtn.onclick = async () => {
        recipe.ingredients.splice(ingIndex, 1);
        await save();
      };

      li.appendChild(delBtn);
      ul.appendChild(li);
    });

    content.appendChild(ul);

    header.onclick = () => content.classList.toggle("collapsed");

    card.appendChild(header);
    card.appendChild(content);
    container.appendChild(card);
  });
}

function renderExtras() {
  const ul = document.getElementById("extraList");
  ul.innerHTML = "";

  data.extras.forEach((e, index) => {
    const li = document.createElement("li");
    li.textContent = `${e.name} – ${e.amount} ${e.unit}`;

    const delBtn = document.createElement("button");
    delBtn.textContent = "x";
    delBtn.className = "delete-btn";
    delBtn.onclick = async () => {
      data.extras.splice(index, 1);
      await save();
    };

    li.appendChild(delBtn);
    ul.appendChild(li);
  });
}

function renderShopping() {
  const ul = document.getElementById("shoppingList");
  ul.innerHTML = "";

  const totals = {};

  Object.values(data.plan || {}).forEach(recipeName => {
    if (!recipeName) return;
    const recipe = data.recipes.find(r => r.name === recipeName);
    if (!recipe) return;

    recipe.ingredients?.forEach(ing => {
      const key = ing.name + "|" + ing.unit;
      if (!totals[key]) totals[key] = { ...ing };
      else totals[key].amount += ing.amount;
    });
  });

  data.extras.forEach(e => {
    const key = e.name + "|" + e.unit;
    if (!totals[key]) totals[key] = { ...e };
    else totals[key].amount += e.amount;
  });

  Object.values(totals).forEach(item => {
    const key = item.name + "|" + item.unit;
    const li = document.createElement("li");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = !!data.shoppingState[key];

    const span = document.createElement("span");
    span.textContent = ` ${item.name} – ${item.amount} ${item.unit}`;

    checkbox.onchange = async () => {
      data.shoppingState[key] = checkbox.checked;
      await save();
    };

    li.appendChild(checkbox);
    li.appendChild(span);
    ul.appendChild(li);
  });
}

// Extras hinzufügen

document.getElementById("addExtraBtn").onclick = async () => {
  const name = document.getElementById("extraName").value.trim();
  let amount = parseFloat(document.getElementById("extraAmount").value);
  const unit = document.getElementById("extraUnit").value.trim() || "Stück";

  if (!name) return;
  if (!amount || amount <= 0) amount = 1;

  data.extras.push({ name, amount, unit });

  document.getElementById("extraName").value = "";
  document.getElementById("extraAmount").value = "";
  document.getElementById("extraUnit").value = "";

  await save();
};

// Rezept hinzufügen

document.getElementById("addRecipeBtn").onclick = async () => {
  const name = document.getElementById("newRecipeName").value.trim();
  if (!name) return;
  data.recipes.push({ name, ingredients: [] });
  document.getElementById("newRecipeName").value = "";
  await save();
};

</script>

</body>
</html>
